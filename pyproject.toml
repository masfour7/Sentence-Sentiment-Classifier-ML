[project]
name = "sentiment-classifier"
version = "1.0.0"
description = "End-to-end NLP sentiment classifier: TF-IDF + four scikit-learn models with an interactive Streamlit demo."
authors = [{name = "Mohammad Asfour"}]
requires-python = ">=3.11"
dependencies = [
    "altair>=6.1.0",
    "joblib>=1.5.2",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "streamlit>=1.35",
]

[project.optional-dependencies]
notebook = [
    "jupyter>=1.1",
    "notebook>=7.0",
    "matplotlib>=3.8",
    "gensim>=4.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"
